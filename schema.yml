openapi: 3.0.3
info:
  title: Score API
  version: 1.0.0
  description: Documentation de l'API du projet Score
paths:
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Permet à un utilisateur authentifié de changer son mot de passe.
      summary: Changer le mot de passe
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
              required:
              - old_password
              - new_password
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          description: Mot de passe modifié avec succès
        '400':
          description: Ancien mot de passe incorrect ou paramètres manquants
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authentification par email/password. Retourne les tokens JWT.
      summary: Connexion utilisateur
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Identifiants invalides
        '403':
          description: Compte inactif
  /api/auth/password-setup/:
    post:
      operationId: auth_password_setup_create
      description: Permet à un utilisateur de définir son mot de passe via uid et
        token reçus par email.
      summary: Définir le mot de passe initial
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                token:
                  type: string
                password:
                  type: string
              required:
              - uid
              - token
              - password
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: Mot de passe défini avec succès
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Paramètres invalides ou token expiré
  /api/auth/profile/:
    put:
      operationId: auth_profile_update
      description: Permet à un utilisateur authentifié de modifier son username et
        sa photo.
      summary: Mettre à jour le profil utilisateur
      tags:
      - Profil
      requestBody:
        content:
          application/json:
