          description: ''
        '400':
          description: Données invalides
  /api/auth/reset-code/:
    post:
      operationId: auth_reset_code_create
      description: Envoie un code OTP à 6 chiffres par email. Limité à 4 tentatives/jour
        avec 90s entre chaque.
      summary: Demander un code de réinitialisation
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
              - email
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: Code généré avec succès
        '400':
          description: Email manquant
        '429':
          description: Trop de tentatives ou délai non respecté
  /api/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: Réinitialise le mot de passe avec le token reçu après validation
        du code OTP.
      summary: Réinitialiser le mot de passe
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
              - token
              - password
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: Mot de passe réinitialisé avec succès
        '400':
          description: Token invalide ou expiré
  /api/auth/verify-code/:
    post:
      operationId: auth_verify_code_create
      description: Valide le code OTP et retourne un token de réinitialisation.
      summary: Vérifier le code OTP reçu par email
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
              required:
              - email
              - code
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: Token de reset retourné
        '400':
          description: Code invalide ou expiré
  /api/auth/verify-credentials/:
    get:
      operationId: auth_verify_credentials_retrieve
      description: Vérifie si le uid et le token sont valides avant de permettre à
        l'utilisateur de définir son mot de passe.
      summary: Vérifier les credentials pour setup du mot de passe
      parameters:
      - in: query
        name: token
        schema:
          type: string
        required: true
      - in: query
        name: uid
        schema:
          type: string
        required: true
      tags:
      - Auth
      security:
      - jwtAuth: []
      - Bearer: []
      - {}
      responses:
        '200':
          description: Token valide
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Paramètres invalides ou token expiré
