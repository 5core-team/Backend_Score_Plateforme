          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfileRequest'
        required: true
      security:
      - jwtAuth: []
      - Bearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Données invalides
    patch:
      operationId: auth_profile_partial_update
      description: Permet à un utilisateur authentifié de modifier son username et
        sa photo.
      summary: Mettre à jour le profil utilisateur
      tags:
